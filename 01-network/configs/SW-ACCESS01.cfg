! ==============================================================================
! Device    : SW-ACCESS01
! Platform  : Cisco Catalyst 2960-24TT, IOS 15.0 (Packet Tracer)
! Role      : Layer 2 access - office zones
! Access    : Fa0/1 VLAN 10 Admin | Fa0/2 VLAN 20 Marketing | Fa0/3 VLAN 30 R&D
! Uplink    : Fa0/24 -> SW-CORE01 Fa0/24 (802.1Q trunk)
! Mgmt      : 192.168.99.11 on VLAN 99, gateway 192.168.99.1
!
! NOTE      : Credentials redacted. Lab environment only.
!             See ../README.md "Known limitations" for gaps in this config.
! ==============================================================================

version 15.0
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname SW-ACCESS01
!
ip ssh version 2
ip domain-name xyang.lab
!
username admin secret 5 <REDACTED>
!
spanning-tree mode pvst
spanning-tree extend system-id
!
! --- Access ports: office zones -----------------------------------------------
interface FastEthernet0/1
 switchport access vlan 10
 switchport mode access
!
interface FastEthernet0/2
 switchport access vlan 20
 switchport mode access
!
interface FastEthernet0/3
 switchport access vlan 30
 switchport mode access
!
interface FastEthernet0/4
!
interface FastEthernet0/5
!
interface FastEthernet0/6
!
interface FastEthernet0/7
!
interface FastEthernet0/8
!
interface FastEthernet0/9
!
interface FastEthernet0/10
!
interface FastEthernet0/11
!
interface FastEthernet0/12
!
interface FastEthernet0/13
!
interface FastEthernet0/14
!
interface FastEthernet0/15
!
interface FastEthernet0/16
!
interface FastEthernet0/17
!
interface FastEthernet0/18
!
interface FastEthernet0/19
!
interface FastEthernet0/20
!
interface FastEthernet0/21
!
interface FastEthernet0/22
!
interface FastEthernet0/23
!
! --- Uplink to core -----------------------------------------------------------
interface FastEthernet0/24
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 switchport mode trunk
!
interface GigabitEthernet0/1
!
interface GigabitEthernet0/2
!
! --- Default VLAN disabled ----------------------------------------------------
interface Vlan1
 no ip address
 shutdown
!
! --- Management interface, separate from all user traffic ---------------------
interface Vlan99
 ip address 192.168.99.11 255.255.255.0
!
ip default-gateway 192.168.99.1
!
line con 0
!
line vty 0 4
 login local
 transport input ssh
line vty 5 15
 login local
 transport input ssh
!
end
